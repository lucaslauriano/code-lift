packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  # language + tooling
  typescript: 6.0.3
  '@types/node': ^26.6.2
  tsx: ^4.23.15
  eslint: ^10.11.0
  typescript-eslint: ^8.70.1
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.9
  vitest: ^5.0.1
  '@vitest/coverage-v8': ^5.0.1

  # shared runtime
  zod: ^4.6.5

  # web
  next: ^16.3.6
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  lucide-react: ^1.47.0
  next-themes: ^0.4.6
  sonner: ^2.0.8
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  class-variance-authority: ^0.7.1
  '@tanstack/react-query': ^5.103.2
  zustand: ^5.0.15
  '@monaco-editor/react': ^4.7.0
  react-resizable-panels: ^4.13.3
  next-mdx-remote: ^6.0.0

  # api
  '@nestjs/common': ^12.1.0
  '@nestjs/core': ^12.1.0
  '@nestjs/platform-express': ^12.1.0
  '@nestjs/config': ^12.0.1
  '@nestjs/jwt': ^12.0.2
  '@nestjs/swagger': ^12.0.2
  '@nestjs/testing': ^12.1.0
  '@nestjs/cli': ^12.0.5
  '@prisma/client': ^7.10.0
  prisma: ^7.10.0
  '@prisma/adapter-pg': ^7.10.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  argon2: ^0.45.1
  cookie-parser: ^1.4.7
  '@types/cookie-parser': ^1.4.10
  supertest: ^7.3.0
  '@types/supertest': ^7.2.1

  # runner
  sucrase: ^3.35.1

# Native/postinstall builds we explicitly trust (pnpm 10 blocks the rest).
onlyBuiltDependencies:
  - esbuild
  - argon2
  - prisma
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - sharp
  - unrs-resolver
